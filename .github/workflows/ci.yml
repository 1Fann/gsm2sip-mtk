name: Verify and build local adaptation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify archive and prepare the two runtime adaptations
        shell: pwsh
        run: |
          ./tools/Prepare-Source.ps1
          ./tools/Prepare-Source.ps1
      - name: Install Android build components
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - name: Compile and run release lint
        shell: pwsh
        run: ./tools/Build.ps1 -SdkDir $env:ANDROID_HOME
      - name: Confirm fetched source and binaries are ignored
        shell: pwsh
        run: |
          $unexpected = @(git ls-files -- .work private '*.apk' '*.zip' '*.jks' '*.keystore')
          if ($unexpected.Count) { throw 'Unexpected private/source/binary file in Git' }
      # The stable local signer is retained; no private signing key is uploaded.

  release-tools:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Publish the prepared signed APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $pin = Get-Content upstream.json -Raw | ConvertFrom-Json
          $tag = 'v' + $pin.versionName
          $directory = Join-Path 'releases' $tag
          $manifest = Get-Content (Join-Path $directory 'manifest.json') -Raw | ConvertFrom-Json
          $output = Join-Path $PWD '.work/release'
          New-Item -ItemType Directory -Force $output | Out-Null
          $apk = Join-Path $output $manifest.name
          $stream = [IO.File]::Create($apk)
          try {
            foreach ($part in $manifest.parts) {
              $bytes = [IO.File]::ReadAllBytes((Join-Path $directory $part.file))
              if ($bytes.Length -ne $part.size) { throw 'Release input size mismatch' }
              $stream.Write($bytes, 0, $bytes.Length)
            }
          } finally { $stream.Dispose() }
          $hash = (Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $manifest.sha256 -or (Get-Item $apk).Length -ne $manifest.size) { throw 'Signed APK checksum mismatch' }
          $checksumLines = @("$hash  $($manifest.name)")
          $existing = gh api "repos/$env:GH_REPO/releases/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            $oldApk = @($release.assets | Where-Object name -eq $manifest.name)
            if ($oldApk.Count -eq 0) {
              gh release upload $tag $apk
              if ($LASTEXITCODE) { throw 'APK asset upload failed' }
            } elseif ($oldApk[0].digest -ne ('sha256:' + $hash)) {
              throw 'Existing APK differs; refusing to overwrite it'
            }
            $obsoleteName = 'gsm2sip-mtk-tools-' + $tag + '.zip'
            foreach ($asset in @($release.assets | Where-Object name -eq $obsoleteName)) {
              gh api --method DELETE "repos/$env:GH_REPO/releases/assets/$($asset.id)"
              if ($LASTEXITCODE) { throw 'Obsolete toolkit ZIP removal failed' }
            }
          } else {
            gh release create $tag $apk --target $env:GITHUB_SHA --title "GSM2SIP MTK $tag" --notes-file docs/RELEASE_NOTES.md
            if ($LASTEXITCODE) { throw 'Release creation failed' }
          }
          $sums = Join-Path $output 'SHA256SUMS'
          [IO.File]::WriteAllText($sums, ($checksumLines -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
          gh release upload $tag $sums --clobber
          if ($LASTEXITCODE) { throw 'Checksum asset upload failed' }
          gh release edit $tag --title "GSM2SIP MTK $tag" --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE) { throw 'Release notes update failed' }
